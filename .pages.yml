# =====================================================================
# Pages CMS settings for Luna's website  (https://pagescms.org)
# This file turns the files in /content into simple forms for Luna.
# =====================================================================

media:
  input: assets/images        # where uploaded photos are saved in the repository
  output: assets/images       # the path written into the content files
  categories: [image]
  extensions: [jpg, jpeg, png, webp]
  rename: safe                # "My Photo 1.JPG" → "my-photo-1.jpg"

content:
  # ---------------------------------------------------------------- PRODUCTS
  - name: shop
    label: Products & prices
    type: file
    path: content/shop.json
    format: json
    fields:
      - name: prices
        label: Prices (₹)
        description: The starting price for each category. It also shows in the price boxes at the top of the page. Leave a box empty to show "On request".
        type: object
        fields:
          - name: keychains
            label: Keychains
            type: number
            options: { min: 0 }
          - name: charms
            label: Phone charms
            type: number
            options: { min: 0 }
          - name: bags
            label: Bag charms
            type: number
            options: { min: 0 }
          - name: canvas
            label: Canvas art
            type: number
            options: { min: 0 }
      - name: products
        label: Products
        description: The order here is the order on the website.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - name: keychains
                  label: Keychain
                - name: charms
                  label: Phone charm
                - name: bags
                  label: Bag charm
                - name: canvas
                  label: Canvas art
          - name: image
            label: Photo
            description: Square photos look best. Big phone photos are shrunk automatically.
            type: image
            required: true
          - name: description
            label: Short line
            description: One friendly sentence, e.g. "A happy little star for your phone."
            type: string
          - name: price
            label: Special price (optional)
            description: Leave empty to use the category price above.
            type: number
            options: { min: 0 }
          - name: hanging
            label: Hanging charm
            description: Turn on for keychains and charms (adds the little keyring and the swing). Turn off for canvases.
            type: boolean
          - name: couple
            label: Show in "For the two of you"
            description: Turn on for pieces that come as a pair (shown in the couples section near the top, and in the shop).
            type: boolean
          - name: alt
            label: Photo description (optional)
            description: Helps blind visitors, e.g. "Pink clay star keychain with a swirl".
            type: string

  # ---------------------------------------------------------------- PAGE TEXT
  - name: page
    label: Page text & photos
    type: file
    path: content/page.json
    format: json
    fields:
      - name: hero_eyebrow
        label: Top · small handwritten line
        type: string
      - name: hero_title
        label: Top · big headline
        type: string
      - name: hero_highlight
        label: Top · word to colour blue
        description: Must be a word from the headline, e.g. moonlit
        type: string
      - name: hero_text
        label: Top · intro text
        type: text
      - name: hero_photo_1
        label: Top · left framed photo
        type: image
      - name: hero_photo_2
        label: Top · right framed photo
        type: image
      - name: trust
        label: Three little promises (under the hills)
        type: string
        list: { min: 3, max: 3 }
      - name: couples_title
        label: Couples · title
        type: string
      - name: couples_note
        label: Couples · handwritten note
        type: string
      - name: couples_text
        label: Couples · text
        type: text
      - name: shop_title
        label: Shop · title
        type: string
      - name: shop_note
        label: Shop · handwritten note
        type: string
      - name: price_prefix
        label: Word before prices
        description: Shown before every price, e.g. "from" gives "from ₹90". Leave empty to show just "₹90".
        type: string
      - name: reviews_title
        label: Reviews · title
        type: string
      - name: reviews_note
        label: Reviews · handwritten note
        type: string
      - name: about_title
        label: About · title
        type: string
      - name: about_text
        label: About · your story
        description: Leave an empty line between paragraphs.
        type: text
      - name: about_sign
        label: About · handwritten sign-off
        type: string
      - name: about_photo
        label: About · photo
        type: image
      - name: custom_eyebrow
        label: Custom orders · handwritten line
        type: string
      - name: custom_title
        label: Custom orders · title
        type: string
      - name: custom_text
        label: Custom orders · text
        type: text
      - name: custom_steps
        label: Custom orders · steps
        type: string
        list: { min: 1, max: 5 }
      - name: faq_title
        label: FAQ · title
        type: string
      - name: footer_note
        label: Footer · handwritten line
        type: string

  # ---------------------------------------------------------------- REVIEWS
  - name: reviews
    label: Reviews
    type: file
    path: content/reviews.json
    format: json
    list: true
    fields:
      - name: quote
        label: What they said
        type: text
        required: true
      - name: name
        label: Their name
        type: string
        required: true
      - name: piece
        label: What they bought
        type: string
      - name: image
        label: Photo of their piece (optional)
        type: image
      - name: alt
        label: Photo description (optional)
        type: string

  # ---------------------------------------------------------------- FAQ
  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true

  # ---------------------------------------------------------------- CONTACT
  - name: contact
    label: WhatsApp & Instagram
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: whatsapp
        label: WhatsApp number
        description: With country code, digits only, e.g. 919494293902
        type: string
      - name: instagram
        label: Instagram username
        description: Without the @, e.g. luna_.evermore
        type: string
